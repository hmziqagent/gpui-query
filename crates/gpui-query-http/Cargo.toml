[package]
name = "gpui-query-http"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "HTTP cache-header helpers for gpui-query (server-wins CachePolicy + HttpCache)"
repository = "https://github.com/freeoxide/gpui-query"
license = "MIT"
keywords = ["gpui", "http", "caching", "cache-control", "query"]
categories = ["asynchronous", "caching", "web-programming::http-client"]
homepage = "https://gpui-query.freeoxide.com"
authors = ["hmziqrs"]

[features]
default = []
## Enables the optional `reqwest`-based backend
## ([`crate::reqwest_backend::ReqwestBackend`]).
##
## Off by default so the crate stays usable as a pure, library-agnostic HTTP
## cache: any request library can plug into
## [`crate::backend::HttpBackend`].
reqwest = ["dep:reqwest"]

[dependencies]
# `version` is required alongside `path`: `cargo publish` strips the path
# override and the published manifest must reference the crates.io release.
gpui-query = { path = "../gpui-query", version = "0.2", default-features = false, features = ["core"] }
bytes = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { workspace = true }
thiserror = "2"

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }

# Docs.rs convention (see AGENTS.md / main crate): render with every feature so
# the `reqwest`-gated `reqwest_backend` module and its re-export appear; the
# default-features render would leave dead intra-doc links to them.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
