[package]
name = "gpui-query-http"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "HTTP cache-header helpers for gpui-query (server-wins CachePolicy + HttpCache)"
repository = "https://github.com/freeoxide/gpui-query"
license = "MIT"
keywords = ["gpui", "http", "caching", "cache-control", "query"]
categories = ["asynchronous", "caching", "web-programming::http-client"]
homepage = "https://gpui-query.freeoxide.com"
authors = ["hmziqrs"]

[features]
default = []
## Optional `reqwest` backend; off by default so any client can plug into
## [`crate::backend::HttpBackend`] instead.
reqwest = ["dep:reqwest"]

[lib]
bench = false

[dependencies]
# `version` must stay alongside `path`: `cargo publish` strips the path override.
gpui-query = { path = "../gpui-query", version = "0.2", default-features = false, features = ["core"] }
bytes = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { workspace = true }
thiserror = "2"

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

# All-features render: the reqwest-gated module and re-export would otherwise
# be dead intra-doc links.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
