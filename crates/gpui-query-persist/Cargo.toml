[package]
name = "gpui-query-persist"
version = "0.1.0"
edition = "2024"
description = "Reference disk-based persistence adapter (FilePersister) for gpui-query"
repository = "https://github.com/freeoxide/gpui-query"
readme = "README.md"
license = "MIT"
keywords = ["gpui", "persistence", "cache", "query", "filesystem"]
categories = ["asynchronous", "caching", "filesystem"]
homepage = "https://gpui-query.freeoxide.com"
authors = ["hmziqrs"]

[features]
default = []

[lib]
bench = false

[dependencies]
# `version` is required alongside `path`: `cargo publish` strips the path override.
gpui-query = { path = "../gpui-query", version = "0.2", default-features = false, features = ["persist", "client", "hook"] }
dirs = "6"
tempfile = "3"
bincode = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gpui = { workspace = true }
pollster = "0.4"
criterion = { workspace = true }

[[test]]
name = "file_persister"
bench = false

[[bench]]
name = "persist_round_trip"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
