[package]
name = "gpui-query-persist"
version = "0.1.0"
edition = "2024"
description = "Reference disk-based persistence adapter (FilePersister) for gpui-query"
repository = "https://github.com/freeoxide/gpui-query"
readme = "README.md"
license = "MIT"
keywords = ["gpui", "persistence", "cache", "query", "filesystem"]
categories = ["asynchronous", "caching", "filesystem"]
homepage = "https://gpui-query.freeoxide.com"
authors = ["hmziqrs"]

[features]
default = []

[dependencies]
# `version` is required alongside `path`: `cargo publish` strips the path
# override and the published manifest must reference the crates.io release.
gpui-query = { path = "../gpui-query", version = "0.2", default-features = false, features = ["persist", "client", "hook"] }
dirs = "6"
tempfile = "3"
bincode = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
pollster = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
