[package]
name = "gpui-query"
version = "0.2.0"
edition = "2024"
description = "TanStack Query-inspired async state management for GPUI"
repository = "https://github.com/freeoxide/gpui-query"
readme = "README.md"
license = "MIT"
keywords = ["gpui", "async", "state-management", "query", "zed"]
categories = ["asynchronous", "caching", "gui"]
homepage = "https://gpui-query.freeoxide.com"
authors = ["hmziqrs"]

[features]
default = ["client"]
core = []
client = ["core", "dep:gpui"]
hook = ["client"]
persist = ["client", "hook", "dep:serde_json", "dep:thiserror"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }
gpui = { workspace = true, optional = true }

# ahash's default `runtime-rng` feature pulls getrandom, which hard-errors on
# wasm32-unknown-unknown. The two declarations are mutually exclusive so the
# native build keeps the default feature set (runtime-rng) while wasm uses
# compile-time RNG.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ahash = { version = "0.8" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }

[dev-dependencies]
serde_json = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
