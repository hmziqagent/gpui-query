[package]
name = "gpui-query"
version = "0.3.0"
edition = "2024"
description = "TanStack Query-inspired async state management for GPUI"
repository = "https://github.com/freeoxide/gpui-query"
readme = "README.md"
license = "MIT"
keywords = ["gpui", "async", "state-management", "query", "zed"]
categories = ["asynchronous", "caching", "gui"]
homepage = "https://gpui-query.freeoxide.com"
authors = ["hmziqrs"]

[features]
default = ["client"]
core = []
client = ["core", "dep:gpui"]
hook = ["client"]
persist = ["client", "hook", "dep:serde_json", "dep:thiserror"]

[lib]
bench = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }
gpui = { workspace = true, optional = true }

# ahash's runtime-rng pulls getrandom, which hard-errors on wasm32-unknown-unknown;
# wasm builds use compile-time RNG instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ahash = { version = "0.8" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ahash = { version = "0.8", default-features = false, features = ["std", "compile-time-rng"] }

[dev-dependencies]
serde_json = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
proptest = "1"
criterion = { workspace = true }

[[test]]
name = "edge_cases"
bench = false

[[bench]]
name = "sanitize"
harness = false

[[bench]]
name = "key_path"
harness = false

[[bench]]
name = "request_policy"
harness = false

[[bench]]
name = "request_id"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
