[workspace]
members = ["crates/gpui-query", "crates/gpui-query-http", "crates/gpui-query-persist"]
exclude = ["crates/gpui-query-legacy"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { package = "gpui-pre", version = "0.3" }
