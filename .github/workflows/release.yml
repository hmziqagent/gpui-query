name: Publish Crate (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

jobs:
  publish-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      # No `workspaces` override: the repo root is the workspace root and
      # rust-cache resolves the default "." against GITHUB_WORKSPACE, not the
      # job's working-directory — the old "crates/gpui-query -> target"
      # mapping cached a directory cargo never writes. The working-directory
      # on the run steps below is unaffected.
      - uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        working-directory: crates/gpui-query
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_VERSION="${{ github.event.inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml has $VERSION, tag has $TAG_VERSION"
            exit 1
          fi
          echo "Publishing gpui-query v$VERSION"

      - name: Publish main crate to crates.io
        working-directory: crates/gpui-query
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: publish-main
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=gpui-query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
