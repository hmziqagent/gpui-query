name: Web Preview

# Builds web/ on every PR push and publishes an isolated Cloudflare Pages
# PREVIEW deployment (branch=pr-<N>), then posts the URL back to the PR.
# Production (master) is untouched — it still deploys only via deploy.yml.
# Deploying a non-production branch is what makes wrangler create a Pages
# preview (served at pr-<N>.gpui-query.pages.dev + a unique <hash> URL).

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/web-preview.yml"

# Fork PRs can't see the CLOUDFLARE_* secrets, so their deploy step would
# fail — skip them outright (they still get the PR Checks build dry-run).
permissions:
  contents: read
  pull-requests: write # post the preview URL comment

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist/client \
            --project-name=gpui-query \
            --branch="pr-${{ github.event.pull_request.number }}" \
            | tee deploy.log
          # wrangler prints the unique deployment URL (a *.pages.dev link).
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | head -n1 || true)
          echo "deployment_url=${url}" >> "$GITHUB_OUTPUT"
          echo "alias_url=https://pr-${{ github.event.pull_request.number }}.gpui-query.pages.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const alias = `${{ steps.deploy.outputs.alias_url }}`;
            const deployUrl = `${{ steps.deploy.outputs.deployment_url }}` || alias;
            const sha = context.sha.slice(0, 7);
            const marker = "<!-- cloudflare-pages-preview -->";
            const body = `${marker}
            ## ☁️ Web preview deployed

            - **Stable URL (updates each push):** ${alias}
            - **This deployment:** ${deployUrl}
            - Built from \`${sha}\` · production (\`master\`) is unaffected.

            _Cloudflare Pages preview — created by the \`Web Preview\` workflow._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
