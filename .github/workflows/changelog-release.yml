name: Changelog Release

on:
  push:
    branches: [master]
    paths:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.exists == 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # Without fetch-tags, a shallow checkout fetches NO tags, so the
          # `git tag -l` guard below would always report "not exists" and
          # every CHANGELOG-path push would re-attempt the release.
          fetch-tags: true

      - name: Extract version from CHANGELOG
        id: changelog
        run: |
          VERSION=$(grep -m 1 -oP '\[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git tag -l | grep -q "^${{ steps.changelog.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        id: notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          NOTES=$(awk "/\[${VERSION}\]/,/^## \[([0-9]+\.){2}[0-9]+\]/" CHANGELOG.md | head -n -1 | tail -n +2 | sed '/^$/d; 1{/^$/d}')
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml versions
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/gpui-query/Cargo.toml
          # Keep the version literal in sync across the install snippets that
          # external systems render statically (crates.io README, GitHub README,
          # docs installation page). Mirrors the Cargo.toml bump above; both the
          # bare `gpui-query = "x.y.z"` and table `version = "x.y.z"` forms.
          sed -i -E \
            -e 's|gpui-query = "[^"]*"|gpui-query = "'"$VERSION"'"|g' \
            -e 's|gpui-query = [{] version = "[^"]*"|gpui-query = { version = "'"$VERSION"'"|g' \
            README.md \
            crates/gpui-query/README.md \
            web/src/content/docs/docs/getting-started/installation.mdx

      - name: Commit version bump
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/gpui-query/Cargo.toml README.md crates/gpui-query/README.md web/src/content/docs/docs/getting-started/installation.mdx
          git diff --cached --quiet || git commit -m "chore: bump gpui-query version to v${{ steps.changelog.outputs.version }}"

      - name: Create Git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.changelog.outputs.tag }}" -m "Release v${{ steps.changelog.outputs.version }}"

      - name: Push tag and commit
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git push origin HEAD:${{ github.ref }}
          git push origin "${{ steps.changelog.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Release ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.version, '-') }}

  publish-main:
    needs: check-and-release
    # Same guard as the check_tag-gated steps above, via the job output —
    # `needs:` alone would still run this job on the skip path (tag already
    # exists) and re-attempt `cargo publish` on an already-released version.
    if: needs.check-and-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      # No `workspaces` override: the repo root is the workspace root and
      # rust-cache resolves the default "." against GITHUB_WORKSPACE, not the
      # job's working-directory — the old "crates/gpui-query -> target"
      # mapping cached a directory cargo never writes. The working-directory
      # on the run steps below is unaffected.
      - uses: Swatinem/rust-cache@v2

      - name: Verify version
        working-directory: crates/gpui-query
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "Publishing gpui-query v$VERSION"

      - name: Publish main crate
        working-directory: crates/gpui-query
        run: cargo publish || echo "Already published, continuing."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy-web:
    needs: [publish-main, check-and-release]
    # Skip-path guard as in publish-main — avoids redundant prod redeploys
    # when the CHANGELOG's first version heading is already tagged.
    if: needs.check-and-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: web

    steps:
      # Check out the tagged commit (created by check-and-release) so the web
      # build sees the version-bumped Cargo.toml — read at build time by the OG
      # image and changelog page — and the synced markdown install snippets.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-release.outputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name=gpui-query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
