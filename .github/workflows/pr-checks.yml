name: PR Checks

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/pr-checks.yml"
      # Sibling web workflows: without these, a PR touching only deploy.yml
      # or web-preview.yml would get zero checks. The dry-run below exercises
      # the same bun build those workflows run, so their build-affecting
      # changes (toolchain versions, build env) still get PR-time signal.
      - ".github/workflows/deploy.yml"
      - ".github/workflows/web-preview.yml"

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build dry-run
        run: bun run build
        env:
          CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
